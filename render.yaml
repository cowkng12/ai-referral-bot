services:
  - type: web
    name: aivoraref-bot
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run render:start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STATE_TABLE
        value: app_state
      - key: SUPABASE_STATE_KEY
        value: aivoraref-bot
      - key: SHOP_URL
        value: https://t.me/AivoraHub_bot
      - key: SHOP_WEB_APP_URL
        value: https://wakewlsamweneurix.onrender.com
      - key: SUPPORT_URL
        value: https://t.me/AivoraHubSupport_bot
      - key: MAIN_CHANNEL_URL
        value: https://t.me/AivoraaHub
      - key: MAIN_CHANNEL_USERNAME
        value: '@AivoraaHub'
